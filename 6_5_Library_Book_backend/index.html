<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Book Catalog</h1>

        <form action="/index.html" method="post" id="create-book-form">
            <div class="form-group">
                <label for="book-name">Name:</label>
                <input type="text" id="book-name" required>
            </div>
            <div class="form-group">
                <label for="book-author">Author:</label>
                <input type="text" id="book-author" required>
            </div>
            <div class="form-group">
                <label for="book-image-url">Image URL:</label>
                <input type="text" id="book-image-url">
            </div>
            <div class="form-group">
                <label for="book-pages">Pages:</label>
                <input type="number" id="book-pages" required>
            </div>
            <div class="form-group">
                <label for="book-price">Price:</label>
                <input type="number" id="book-price" step="0.01" required>
            </div>
            <button type="submit">Add Book</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Image</th>
                    <th>Pages</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="book-list"></tbody>
        </table>
    </div>

    <script src="index.js"></script>
</body>
</html>
